version: 2
updates:
  # npm dependencies (Cypress, TypeScript, ESLint, the preprocessor chain, ...)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for the routine dev-tooling bumps instead of a dozen.
      dev-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  # Keep the GitHub Actions in .github/workflows/ up to date too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
